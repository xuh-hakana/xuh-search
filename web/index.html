<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>search</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23ffffff'/%3E%3Ccircle cx='14' cy='14' r='6' fill='none' stroke='%231d1d1f' stroke-width='2.4'/%3E%3Cpath d='M18.5 18.5 24 24' stroke='%230a7cff' stroke-width='2.8' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m15.5 15.5 4.3 4.3"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7.5a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-10Z"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6.5 3.5h7l4 4v13h-11v-17Z"/><path d="M13.5 3.5v4h4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6.5 6.5 11 11M17.5 6.5l-11 11"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M8.8 3.6h6.4v4.8l2.3 3.5H6.5l2.3-3.5V3.6Z"/><path d="M12 11.9v8.5"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.4 2.3 3.6 5.2 3.6 8.5S14.4 18.2 12 20.5c-2.4-2.3-3.6-5.2-3.6-8.5S9.6 5.8 12 3.5Z"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-.8 5.2"/><path d="M20 4v7h-7"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6.5 9.5 5.5 5.5 5.5-5.5"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13.5a3.6 3.6 0 0 0 5.1 0l2.9-2.9a3.6 3.6 0 0 0-5.1-5.1L11.4 7"/><path d="M14 10.5a3.6 3.6 0 0 0-5.1 0l-2.9 2.9a3.6 3.6 0 0 0 5.1 5.1L12.6 17"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2.4"/><path d="M15.5 8.5V6.4a2 2 0 0 0-2-2H6.4a2 2 0 0 0-2 2v7.1a2 2 0 0 0 2 2h2.1"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15.5H6.5A2.5 2.5 0 0 0 4 21V5.5Z"/><path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H20"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3.5 13.7 9l5.5 1.7-5.5 1.7L12 18l-1.7-5.6L4.8 10.7 10.3 9 12 3.5Z"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h13M13 6.5 18.5 12 13 17.5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4 20.5 19H3.5L12 4Z"/><path d="M12 9.5v4.5M12 16.6v.2"/></symbol>
    <symbol id="i-cube" viewBox="0 0 24 24"><path d="M12 2.8 21 7.5v9L12 21.2 3 16.5v-9L12 2.8Z"/><path d="m3.4 7.6 8.6 4.7 8.6-4.7M12 12.3v8.4"/></symbol>
    <symbol id="i-e" viewBox="0 0 24 24"><path d="M16 7.5a5 5 0 1 0 0 9"/><path d="M16 12h-4.5"/></symbol>
    <symbol id="i-swap" viewBox="0 0 24 24"><path d="M4.5 8.5h13M14 5l3.5 3.5L14 12"/><path d="M19.5 15.5h-13M10 12l-3.5 3.5L10 19"/></symbol>
    <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 4.2v7.2"/><path d="M7.4 7.2a6.6 6.6 0 1 0 9.2 0"/></symbol>
    <symbol id="i-meme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14c1.2 1.6 2.8 2.4 3.5 2.4S14.3 15.6 15.5 14"/><circle cx="9" cy="10" r="1.1"/><circle cx="15" cy="10" r="1.1"/></symbol>
  </svg>

  <div class="panel">
    <header class="topbar">
      <button class="pin" id="pinBtn" type="button" title="置顶">
        <svg class="icon"><use href="#i-pin"/></svg>
      </button>
      <div class="pills">
        <!-- 不常开的先放，最后才是常驻的文件统计；这一条排不下就横着滑 -->
        <button class="pill pill-new" id="newChip" type="button" hidden>
          <span class="dot"></span>新增 <b id="newCount">0</b>
        </button>
        <button class="pill pill-warn" id="changedChip" type="button" hidden>
          <span class="dot"></span>已变更 <b id="changedCount">0</b>
        </button>
        <button class="pill" id="okChip" type="button" hidden>
          <span class="dot dot-ok"></span>正常
        </button>
      </div>
      <span class="stat" id="statText">—</span>
      <div class="quick">
        <button class="round" id="dockBtn" type="button" title="接命令方块：文件命中改读它里面的">
          <svg class="icon"><use href="#i-cube"/></svg>
        </button>
        <button class="round" id="cornerBtn" type="button" title="换到另一边" hidden>
          <svg class="icon"><use href="#i-swap"/></svg>
        </button>
        <button class="round" id="easyBtn" type="button" title="用 Easydict 查">
          <svg class="icon"><use href="#i-e"/></svg>
        </button>
        <button class="credit-q" type="button" data-credit="search" title="这个工具是谁做的、用的什么" aria-label="search 署名">?</button>
        <button class="round" id="webBtn" type="button" title="在浏览器里搜">
          <svg class="icon"><use href="#i-link"/></svg>
        </button>
        <button class="round" id="memeBtn" type="button" title="查梗 · 娱乐网站">
          <svg class="icon"><use href="#i-meme"/></svg>
        </button>
        <button class="round" id="restartBtn" type="button" title="重启服务：重新加载后端（界面也会刷新）">
          <svg class="icon"><use href="#i-refresh"/></svg>
        </button>
        <button class="round" id="closeBtn" type="button" title="收起">
          <svg class="icon"><use href="#i-close"/></svg>
        </button>
      </div>
    </header>

    <div class="input-zone">
      <div class="pair-row">
        <span class="pair" id="pairEn">—</span>
        <span class="pair-arrow">↔</span>
        <span class="pair" id="pairZh">—</span>
      </div>
      <div class="input-card">
        <input id="findInput" class="term-input" type="text" placeholder="输入词，或在别处复制一段话" autocomplete="off" spellcheck="false">
        <div class="input-foot">
          <button class="ico" id="copyBtn" type="button" title="复制这个词">
            <svg class="icon"><use href="#i-copy"/></svg>
          </button>
          <button class="ico" id="refreshBtn" type="button" title="重查">
            <svg class="icon"><use href="#i-refresh"/></svg>
          </button>
          <span class="badge" id="kindBadge" hidden>识别为 <b id="kindText">英语</b></span>
          <button class="badge badge-scope" id="scopeBtn" type="button" title="不改登记目录，直接翻整台电脑">整台电脑</button>
          <span class="input-note" id="inputNote"></span>
          <button class="ico ico-close" id="clearBtn" type="button" title="清空">
            <svg class="icon"><use href="#i-close"/></svg>
          </button>
        </div>
      </div>
    </div>

    <section class="roots">
      <span class="roots-label">文件</span>
      <div class="root-chips" id="rootChips"></div>
      <button class="root-add" id="addRootBtn" type="button" title="登记文件夹">
        <svg class="icon"><use href="#i-plus"/></svg>
      </button>
    </section>

    <section class="axhint" id="axHint" hidden>
      <span class="axhint-t">划词还没授权</span>
      <button type="button" id="axGo">去打开</button>
      <button class="axhint-x" type="button" id="axNo" title="这次先不看">
        <svg class="icon"><use href="#i-close"/></svg>
      </button>
    </section>

    <!-- 服务那一行：分类总闸 → 被关掉的服务小标 → 右边是「关 / 开 / 简」（只控文字多少） -->
    <section class="svcrow">
      <div class="rail" id="svcRail">
        <button class="round tog" id="webToggle" type="button" title="联网抓取">
          <svg class="icon"><use href="#i-globe"/></svg>
          <i class="tick">联</i>
        </button>
        <button class="round tog" id="manageToggle" type="button" title="查登记目录里的文件">
          <svg class="icon"><use href="#i-book"/></svg>
          <i class="tick">管</i>
        </button>
        <button class="round tog" id="funToggle" type="button" title="娱乐：萌娘百科 ＋ 查梗 / 梗站目录">
          <svg class="icon"><use href="#i-meme"/></svg>
          <i class="tick">娱</i>
        </button>
        <span class="qsep"></span>
        <div class="src-tags" id="srcTags"></div>
      </div>
      <div class="verb-wrap">
        <span class="verb-cap">【关/开/简】</span>
        <div class="seg" id="verbSeg" role="group" aria-label="词义显示程度">
          <button type="button" data-v="off" title="一键收起全部卡片">关</button>
          <button type="button" data-v="full" title="一键展开全部卡片">开</button>
          <button type="button" data-v="brief" title="只中英对照＋一句话">简</button>
        </div>
      </div>
    </section>

    <section class="changes" id="changesPanel" hidden></section>

    <section class="board">
      <main class="scroll" id="scroll">
        <div id="blocks"></div>
        <div id="webCards"></div>
        <div class="empty" id="emptyHint">
          <p>在别处复制一个词，这里会自己跟上。</p>
        </div>
      </main>
    </section>

    <div class="toast-layer" id="toastLayer" aria-live="polite"></div>
  </div>

  <!-- 查梗 · 娱乐网站 面板 -->
  <div class="modal meme-modal" id="memePanel" hidden>
    <div class="modal-card meme-card" role="dialog" aria-modal="true" aria-label="查梗 · 娱乐网站">
      <div class="modal-head">
        <h2>查梗 · 娱乐网站</h2>
        <span class="modal-x" data-act="meme-close" title="关掉">×</span>
      </div>
      <div class="meme-search">
        <input id="memeInput" class="meme-input" type="text" placeholder="输入梗名，或粘一句带梗的话" autocomplete="off" spellcheck="false">
        <button class="btn" id="memeGo" type="button">查</button>
      </div>
      <div class="meme-result" id="memeResult"></div>
      <div class="meme-dir-head">娱乐 / 梗站目录（点开即查，按可靠度分级）<small>要加/删站点：去虚幻客户端「查梗」页</small></div>
      <div class="meme-dir" id="memeDir"></div>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>
  <!-- 署名小问号：只读展示作者与许可，不改任何第三方文件 -->
  <script src="/js/credit.js"></script>
</body>
</html>
